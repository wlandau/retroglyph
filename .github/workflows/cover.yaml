on: [push, pull_request]

name: cover

jobs:
  cover:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::rstudioapi
          needs: coverage

      - name: Test coverage
        run: |
          coverage <- covr::package_coverage()
          print(coverage)
          zero <- covr::zero_coverage(coverage)
          zero <- zero[!grepl("^src", zero$filename),, drop = FALSE]
          zero <- zero[zero$functions != "retro_app_server",, drop = FALSE]
          print(zero)
          if (nrow(zero)) stop("some lines not covered by tests")
        shell: Rscript {0}
